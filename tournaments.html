<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokerKing Nairobi | Tournaments</title>
    <meta name="description" content="Upcoming poker tournaments at PokerKing Nairobi — schedule and online registration." />
    <link rel="icon" type="image/jpeg" href="assets/Pokerking_sq.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="tournaments">
    <header class="topbar">
      <div class="topbar-shell">
        <div class="header-brand-row">
          <a class="brand" href="index.html" aria-label="PokerKing Nairobi home">
            <img src="assets/logo.png" alt="PokerKing Nairobi logo" />
          </a>
        </div>
      </div>
      <nav class="subnav" data-subnav aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="cash-games.html" data-nav="cash">Cash</a>
        <a href="tournaments.html" data-nav="tournaments">Tournaments</a>
        <a href="gallery.html" data-nav="gallery">Gallery</a>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <div class="page-hero-row">
            <div class="page-hero-text">
              <h1>Tournaments</h1>
              <p>Three signature events — tap Register to signup.</p>
            </div>
            <button type="button" class="btn secondary btn-compact" data-house-rules-open>
              House Rules
            </button>
          </div>
        </div>
      </section>

      <section class="tournament-poster-section">
        <div class="container">
          <figure class="series-poster" data-series-poster hidden>
            <img src="" alt="" data-series-poster-img />
            <figcaption data-series-poster-caption></figcaption>
          </figure>
        </div>
      </section>

      <section>
        <div class="container">
          <div class="section-head">
            <h2>Events</h2>
            <p>Tap Register for full structure and online signup.</p>
          </div>
          <div class="tournament-schedule" data-tournament-list>
            <p class="note">Loading schedule…</p>
          </div>
        </div>
      </section>
    </main>

    <div class="register-modal" data-register-modal hidden>
      <div class="register-modal-backdrop" data-modal-close tabindex="-1" aria-hidden="true"></div>
      <div
        class="register-modal-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="register-modal-title"
      >
        <button class="register-modal-close" type="button" data-modal-close aria-label="Close">×</button>
        <h2 id="register-modal-title" data-modal-title>Register</h2>
        <div class="register-modal-details" data-modal-details></div>
        <form class="form-card register-modal-form" data-registration-form action="https://formspree.io/f/xaqkoqez" method="post">
          <input type="hidden" name="tournament" data-tournament-input value="" />
          <div class="form-grid">
            <label>
              Full name
              <input type="text" name="name" required autocomplete="name" />
            </label>
            <label>
              Phone / WhatsApp
              <input type="tel" name="phone" required autocomplete="tel" />
            </label>
          </div>
          <input type="hidden" name="_subject" value="PokerKing Tournament Registration" />
          <div class="actions" style="margin-top: 0.85rem">
            <button class="btn primary" type="submit">Submit Registration</button>
          </div>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <div class="rules-image-modal" data-house-rules-modal hidden>
      <div class="rules-image-modal-backdrop" data-modal-close tabindex="-1" aria-hidden="true"></div>
      <div
        class="rules-image-modal-panel"
        role="dialog"
        aria-modal="true"
        aria-label="PokerKing tournament rules"
      >
        <button class="rules-image-modal-close" type="button" data-modal-close aria-label="Close">
          ×
        </button>
        <img
          src="assets/PHOTO-2026-05-21-15-07-03.jpg"
          alt="PokerKing poker tournament rules"
          loading="lazy"
        />
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <p>PokerKing Nairobi · Tournament desk · <span data-year></span></p>
      </div>
    </footer>

    <script src="js/site-config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
