<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokerKing Nairobi | Gallery</title>
    <meta name="description" content="Photos from PokerKing Nairobi cash games, tournaments, and club atmosphere." />
    <link rel="icon" type="image/jpeg" href="assets/Pokerking_sq.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="gallery">
    <header class="topbar">
      <div class="topbar-shell">
        <div class="header-brand-row">
          <a class="brand" href="index.html" aria-label="PokerKing Nairobi home">
            <img src="assets/logo.png" alt="PokerKing Nairobi logo" />
          </a>
        </div>
      </div>
      <nav class="subnav" data-subnav aria-label="Primary">
        <a href="index.html" data-nav="home">Home</a>
        <a href="cash-games.html" data-nav="cash">Cash</a>
        <a href="tournaments.html" data-nav="tournaments">Tournaments</a>
        <a href="gallery.html" data-nav="gallery">Gallery</a>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <h1>Gallery</h1>
          <p>Cash games, tournaments, and the PokerKing club atmosphere.</p>
        </div>
      </section>

      <section>
        <div class="container">
          <div class="gallery-grid">
            <figure class="gallery-main">
              <img src="assets/gallery-real-floor-wide-1.png" alt="PokerKing main floor wide view" loading="lazy" />
              <figcaption>Main floor during live action</figcaption>
            </figure>
            <figure class="gallery-side1">
              <img src="assets/gallery-cash-game-closeup.png" alt="Cash game closeup" loading="lazy" />
              <figcaption>Cash game closeup</figcaption>
            </figure>
            <figure class="gallery-side2">
              <img src="assets/gallery-real-vip-table-2.png" alt="VIP table" loading="lazy" />
              <figcaption>VIP table</figcaption>
            </figure>
            <figure class="gallery-side3">
              <img src="assets/gallery-tournament-floor.png" alt="Tournament floor" loading="lazy" />
              <figcaption>Tournament session</figcaption>
            </figure>
            <figure class="gallery-side4">
              <img src="assets/gallery-real-signage-3.png" alt="Club signage" loading="lazy" />
              <figcaption>Entrance &amp; branding</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>PokerKing Nairobi · Gallery · <span data-year></span></p>
      </div>
    </footer>

    <script src="js/site-config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
