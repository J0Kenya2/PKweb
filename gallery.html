<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokerKing Nairobi | Gallery</title>
    <meta name="description" content="PokerKing Nairobi interior and event gallery." />
    <link rel="icon" type="image/jpeg" href="assets/Pokerking_sq.jpg" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="index.html" aria-label="PokerKing Nairobi home">
          <img src="assets/logo.png" alt="PokerKing Nairobi logo" />
        </a>
        <button class="menu-button" type="button" data-menu-button aria-label="Open navigation">
          Menu
        </button>
        <nav class="menu" data-menu>
          <a href="index.html">Home</a>
          <a href="agenda.html">Agenda</a>
          <a href="cash-games.html">Cash Games</a>
          <a href="tournaments.html">Tournaments</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section>
        <div class="container">
          <div class="section-head">
            <div>
              <h1>Club Gallery</h1>
              <p>Visual preview of our room atmosphere and table experience.</p>
            </div>
          </div>

          <div class="gallery-grid">
            <figure class="gallery-main">
              <img src="assets/gallery-real-floor-wide-1.png" alt="PokerKing real floor wide view" />
              <figcaption>Real-style PokerKing floor wide shot</figcaption>
            </figure>
            <figure class="gallery-side1">
              <img src="assets/gallery-real-vip-table-2.png" alt="PokerKing VIP table angle" />
              <figcaption>VIP table perspective</figcaption>
            </figure>
            <figure class="gallery-side2">
              <img src="assets/gallery-real-signage-3.png" alt="PokerKing signage wall" />
              <figcaption>Signature entrance and wall mood</figcaption>
            </figure>
            <figure class="gallery-side3">
              <img src="assets/hero-cash-game-inplay-ref.png" alt="Poker in-play hands and cards closeup" />
              <figcaption>In-play closeup with hands and live cards</figcaption>
            </figure>
            <figure class="gallery-side4">
              <img src="assets/hero-cash-game-closeup-ref.png" alt="Cash game hero closeup scene" />
              <figcaption>Hero-style cash table closeup</figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>PokerKing Nairobi · Gallery · <span data-year></span></p>
      </div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
